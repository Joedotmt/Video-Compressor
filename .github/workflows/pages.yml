name: Browser app · GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'index.html', 'vite.config.js', 'package*.json', 'scripts/**', 'vendor/**', 'tests/web/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', 'index.html', 'vite.config.js', 'package*.json', 'scripts/**', 'vendor/**', 'tests/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify real browser engines
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          timeout 180 node scripts/smoke-engines.mjs
          timeout 30 node scripts/smoke-worker.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
